<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef3ee">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="機能訓練">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>機能訓練</title>
<style>
:root{
  --bg:#eef3ee; --card:#ffffff; --ink:#2f3a34; --sub:#7b877f; --line:#dde6df;
  --accent:#4f9a7c; --accent-bg:#e2f1ea;
  --red:#d9604f; --red-bg:#fde8e4; --amber:#d99a2b; --amber-bg:#fdf1d9; --ok:#4f9a7c; --ok-bg:#e2f1ea;
  --gray-bg:#eef0ef; --shadow:0 2px 12px rgba(40,70,55,.08); --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b211e; --card:#252d29; --ink:#eef3ef; --sub:#a3b0a8; --line:#36413b;
    --accent-bg:#244236; --red-bg:#4a2a25; --amber-bg:#4a3a1c; --ok-bg:#244236; --gray-bg:#2e3632; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b211e; --card:#252d29; --ink:#eef3ef; --sub:#a3b0a8; --line:#36413b;
  --accent-bg:#244236; --red-bg:#4a2a25; --amber-bg:#4a3a1c; --ok-bg:#244236; --gray-bg:#2e3632; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:17px;line-height:1.5;padding-bottom:60px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:12px 0 10px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{white-space:nowrap;font-weight:800;font-size:20px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.brand .dot{width:32px;height:32px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:17px}
.day{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.day button{border:0;background:transparent;width:38px;height:38px;border-radius:50%;font-size:18px}
.day button:active{background:var(--line)}
.day b{min-width:120px;text-align:center;font-size:16px;white-space:nowrap}
.day b.past{color:var(--amber)}
.gear{border:0;background:var(--card);width:42px;height:42px;border-radius:50%;box-shadow:var(--shadow);font-size:19px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;background:var(--card);border-radius:16px;padding:5px;box-shadow:var(--shadow)}
.tabs button{border:0;background:transparent;border-radius:12px;padding:10px 6px;font-weight:700;font-size:16px;color:var(--sub)}
.tabs button.on{background:var(--accent);color:#fff}
.tabs .badge{display:inline-block;min-width:22px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;margin-left:6px;line-height:20px}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 180px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;white-space:nowrap;font-size:15px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:15px;color:var(--sub);margin:22px 4px 8px;display:flex;align-items:center;gap:8px;font-weight:700}
h2 .n{background:var(--card);border-radius:999px;padding:0 9px;font-size:13px}
.hint{font-size:13px;color:var(--sub);margin:-4px 4px 8px}
/* person cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pc{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);border:2px solid transparent;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px;transition:transform .08s}
.pc:active{transform:scale(.97)}
.pc.done{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.pc .nm{font-size:20px;font-weight:800;line-height:1.25}
.pc .lv{font-size:12px;color:var(--sub);font-weight:600;margin-left:6px}
.pc .row{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.pc .ics{font-size:20px;letter-spacing:2px;min-height:26px}
.pc .ics small{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:0;margin-left:4px}
.pc.muted{background:color-mix(in srgb,var(--card) 70%,var(--bg))}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.t-red{background:var(--red-bg);color:var(--red)} .t-amber{background:var(--amber-bg);color:#a8700c} .t-ok{background:var(--ok-bg);color:var(--accent)} .t-gray{background:var(--gray-bg);color:var(--sub)}
:root[data-theme="dark"] .t-amber{color:#f0c060}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .t-amber{color:#f0c060}}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(20,30,25,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:860px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:0 18px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:24px;max-height:90vh}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sh{position:sticky;top:0;background:var(--bg);padding:16px 0 10px;display:flex;align-items:center;gap:10px;z-index:2}
.sh .nm{font-size:26px;font-weight:800}
.sh .x{margin-left:auto;border:0;background:var(--card);border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:var(--shadow)}
.plans{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.box{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px}
.warn{background:var(--red-bg);border-radius:16px;padding:10px 14px;margin-bottom:10px}
.warn b{color:var(--red)} .warn ul{margin:4px 0 0;padding-left:1.2em}
.goal{font-size:16px} .goal b{color:var(--accent)}
.noplan{background:var(--amber-bg);border-radius:16px;padding:10px 14px;margin-bottom:10px;font-size:15px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mgrid.sm{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.cat{font-weight:800;font-size:14px;color:var(--sub);margin:12px 2px 6px}
.mi .lt{display:flex;align-items:center;gap:6px;padding-right:22px}
.mi .pos{font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;background:var(--gray-bg);color:var(--sub);white-space:nowrap;margin-left:auto}
.mi .dose{font-weight:800;color:var(--accent);font-size:15px}
.mi .pn{font-size:13px;font-weight:700;background:var(--accent-bg);border-radius:8px;padding:1px 7px;align-self:flex-start}
.mi .ca{font-size:12px;color:var(--red);line-height:1.35}
.mi .pu{font-size:11.5px;color:var(--sub)}
.mi.on .dose,.mi.on .ca,.mi.on .pu,.mi.on .pos{color:#fff}
.mi.on .pn,.mi.on .pos{background:rgba(255,255,255,.2)}
.mi{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;min-height:112px;transition:transform .08s}
.mi:active{transform:scale(.96)}
.mi .ic{font-size:26px;line-height:1.1}
.mi .lb{font-weight:800;font-size:17px}
.mi .ds{font-size:12.5px;color:var(--sub);line-height:1.35}
.mi .mn{font-size:12px;font-weight:700;color:var(--accent)}
.mi.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mi.on .ds,.mi.on .mn{color:rgba(255,255,255,.88)}
.mi.on::after{content:"✓";position:absolute;top:8px;right:12px;font-weight:900;font-size:22px}
.mi.sm{min-height:0;padding:10px}
.mi.sm .ic{font-size:17px}
.mi.sm .lb{font-size:15px}
.mi.sm.on::after{top:6px;right:8px;font-size:16px}
.more{border:1px dashed var(--line);background:transparent;border-radius:14px;padding:10px;width:100%;margin-top:10px;color:var(--sub);font-weight:700}
.sec{font-weight:800;margin:16px 2px 8px;font-size:16px}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mood{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 4px;font-size:14px;font-weight:700}
.mood .e{display:block;font-size:24px}
.mood.on{border-color:var(--accent);background:var(--accent-bg)}
textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;min-height:70px;resize:vertical}
.hist{font-size:14px}
.hist .h{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.hist .h:last-child{border-bottom:0}
.hist .d{min-width:74px;color:var(--sub);font-weight:700}
.allbtn{border:0;background:var(--accent-bg);color:var(--accent);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
/* deadlines */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.sm2{background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);border:2px solid transparent;text-align:left}
.sm2.on{border-color:var(--ink)}
.sm2 .l{font-size:12.5px;color:var(--sub);font-weight:700}
.sm2 .n{font-size:26px;font-weight:800;line-height:1.2}
.sm2.r .n{color:var(--red)} .sm2.a .n{color:var(--amber)}
@media (max-width:560px){.sum{grid-template-columns:repeat(2,1fr)}}
.dl{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.dr{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;align-items:center}
.dr .nm{font-weight:800;font-size:18px;line-height:1.3}
.dr .nm small{display:block;font-size:12px;color:var(--sub);font-weight:600}
.pl{border-radius:12px;padding:7px 10px;font-size:13.5px;line-height:1.35}
.pl .k{font-size:11.5px;font-weight:700;opacity:.85}
.pl .v{font-weight:800;font-size:15px}
.pl.red{background:var(--red-bg)} .pl.red .v{color:var(--red)}
.pl.amber{background:var(--amber-bg)} .pl.amber .v{color:#a8700c}
.pl.ok{background:var(--ok-bg)} .pl.ok .v{color:var(--accent)}
.pl.none{background:var(--gray-bg);color:var(--sub)} .pl.none .v{color:var(--sub)}
:root[data-theme="dark"] .pl.amber .v{color:#f0c060}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pl.amber .v{color:#f0c060}}
@media (max-width:640px){.dr{grid-template-columns:1fr 1fr}.dr .nm{grid-column:1/-1}}
.sdh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);border-left:6px solid var(--amber)}
.sdh b{font-size:17px}
.sda{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sdb{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:700}
.sdb.on{background:var(--ok-bg);border-color:var(--accent);color:var(--accent)}
.sts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.sts .lb{font-size:12.5px;color:var(--sub);font-weight:700;margin-right:2px}
.stc{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;color:var(--sub)}
.stc.on,.stb{color:#fff;border-color:transparent}
.stb{display:inline-block;font-size:12.5px;font-weight:800;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.stbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.sdmemo{font-size:13px;color:var(--sub)}
.sdta{margin-top:6px;min-height:56px;font-size:15px}
.ps .sdp td.red{background:#fdeeea;color:#c0412f} .ps .sdp td.amber{background:#fdf4e2}
.foot{font-size:12.5px;color:var(--sub);margin:18px 4px;line-height:1.7}
/* settings, dialogs */
.set .rowb{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:0;background:var(--card);border-radius:12px;padding:10px 14px;font-weight:700;box-shadow:var(--shadow)}
.btn.pri{background:var(--accent);color:#fff}
input.tx{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:.95}
.ver{text-align:center;font-size:11px;color:var(--sub);margin-top:24px}
table.mt{border-collapse:collapse;width:100%;font-size:12px;background:var(--card)}
table.mt th,table.mt td{border:1px solid var(--line);padding:3px 4px;text-align:center}
table.mt td.n{text-align:left;white-space:nowrap;font-weight:700}
.mtwrap{overflow:auto;border-radius:12px}
.lock{max-width:460px;margin:80px auto;background:var(--card);border-radius:20px;padding:24px;box-shadow:var(--shadow);text-align:center}
@media print{
  header,.tabs,.tools,.gear,.sh .x,.noprint,#main{display:none!important}
  body{background:#fff;padding:0} .ov{position:static;display:block!important;background:none} .sheet{max-height:none;box-shadow:none;border-radius:0;max-width:none;animation:none;padding:0}
  body.pp>*{display:none!important} body.pp>#pa{display:block!important}
  .ps{break-after:page}
}
#pa{display:none}
.ps{color:#222;background:#fff;font-size:12.5px;line-height:1.5;width:186mm;margin:0 auto;padding:4mm 0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ps .hd{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid #4f9a7c;padding-bottom:4px;margin-bottom:8px}
.ps .hd h1{font-size:24px;margin:0;font-weight:800}
.ps .hd h1 small{font-size:13px;font-weight:700;color:#666;margin-left:8px}
.ps .hd .r{text-align:right;font-size:11px;color:#555}
.ps .ttl{font-size:13px;font-weight:800;color:#4f9a7c;margin:0 0 2px}
.ps table{border-collapse:collapse;width:100%}
.ps .pl3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.ps .pb{border:1.5px solid #cfdcd4;border-radius:8px;padding:5px 8px;font-size:11.5px}
.ps .pb b{display:block;font-size:13.5px}
.ps .pb.red{border-color:#d9604f;background:#fdeeea} .ps .pb.red b{color:#c0412f}
.ps .pb.amber{border-color:#d99a2b;background:#fdf4e2}
.ps .pb.none{color:#888;background:#f3f4f3}
.ps .wn{border:1.5px solid #d9604f;background:#fdeeea;border-radius:8px;padding:5px 10px;margin-bottom:8px}
.ps .wn ul{margin:2px 0 0;padding-left:1.2em}
.ps .gl{border:1.5px solid #cfdcd4;border-radius:8px;padding:5px 10px;margin-bottom:8px}
.ps .mn td,.ps .mn th{border:1px solid #bbb;padding:3px 6px;text-align:left;font-size:11.5px;line-height:1.4;vertical-align:top}
.ps .mn th{background:#e9f3ee;font-size:11.5px}
.ps .gr{margin-top:8px;table-layout:fixed}
.ps .gr td,.ps .gr th{border:1px solid #bbb;text-align:center;padding:0;height:25px;font-size:10.5px}
.ps .gr th{background:#e9f3ee}
.ps .gr td.l,.ps .gr th.l{text-align:left;padding:0 4px;white-space:nowrap;overflow:hidden;width:118px;font-size:10px}
.ps .gr td.on{background:#4f9a7c;color:#fff;font-weight:800}
.ps .memo td{border:1px solid #bbb;height:30px;padding:2px 6px;vertical-align:top;font-size:11px}
.ps .ft{font-size:10px;color:#777;margin-top:6px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<header class="noprint"><div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot">🌿</span>機能訓練</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="day"><button id="dPrev" aria-label="前の日">‹</button><b id="dLbl"></b><button id="dNext" aria-label="次の日">›</button></div>
      <button class="gear" id="gear" aria-label="設定">⚙︎</button>
    </div>
  </div>
  <div class="tabs"><button id="tabT" class="on">🏃 今日の訓練</button><button id="tabD">👤 相談員用（期限）<span class="badge" id="badge"></span></button></div>
  <div class="tools" id="tools"><input class="search" id="q" placeholder="🔍 名前でさがす"><div class="chips" id="chips"></div></div>
</div></header>
<main class="wrap" id="main"></main>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div id="pa"></div>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=load(); let sdOK=false; let sdOpen=''; let tab='t'; let filt='all'; let dfilt='all'; let cur=null; let showMore=false;
let D=today();
function today(){const t=new Date();return ymd(t)}
function ymd(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function pd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function wa(s){if(!s)return'';const t=pd(s);return 'R'+(t.getFullYear()-2018)+'.'+(t.getMonth()+1)+'.'+t.getDate()}
function md(s){const t=pd(s);return (t.getMonth()+1)+'/'+t.getDate()+'（'+'日月火水木金土'[t.getDay()]+'）'}
const STS=[['upd','更新中','#3d7fc4'],['kuhen','区変中','#8a5cc2'],['shin','申請中','#2a9a9a'],['hosp','入院中','#d9604f'],['rest','お休み中','#7d8a84']];
const stOf=n=>{const o=(S.sd||{})[n];return o&&o.st?STS.find(x=>x[0]===o.st):null};
const smd=d=>+d.slice(5,7)+'/'+ +d.slice(8,10);

const stBadge=n=>{const x=stOf(n);return x?`<span class="stb" style="background:${x[2]}${S.sd[n].stAt>today()?';opacity:.75':''}">${stTxt(n)}</span>`:''};
let ALL=null;function applyGone(){if(!ALL)ALL=PEOPLE;const g=S.gone||[];PEOPLE=ALL.filter(p=>!g.includes(p.n))}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.log)return j}catch(e){}return{log:[],day:{},by:''}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠ 保存できませんでした')}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function days(a){return Math.round((pd(a)-pd(today()))/864e5)}

function cpEnd(p){if(!p.cp)return null;const c=p.cp;return c.cert&&c.cert<c.end?c.cert:c.end}

  const p=cur;if(!p)return;
  const mine=(p.menu&&p.menu.length?p.menu:DEFMENU);
  const mk=mine.map(x=>x.k);
  const others=EXK.filter(k=>!mk.includes(k));
  const extraOn=others.filter(k=>isOn(p.n,D,k));
  const lib=MKEYS.map(c=>{const L=others.filter(k=>EX[k].c===c&&!extraOn.includes(k));return L.length?`<div class="cat">${MENU[c].ic} ${MENU[c].lb}</div><div class="mgrid sm">${L.map(k=>mi(p,{k},1)).join('')}</div>`:''}).join('');
  const dr=dayRec(p.n,D);
  let plans='';
  if(p.cat==='shou')plans='<span class="tag t-gray">障がい福祉サービス</span>';
  else{
    plans+=p.cp?`<span class="tag t-${st(cpEnd(p))==='red'?'red':st(cpEnd(p))==='amber'?'amber':'ok'}">ケアプラン ${wa(cpEnd(p))}まで</span>`:'<span class="tag t-red">ケアプランなし</span>';
    plans+=p.dp?`<span class="tag t-${st(p.dp.end)==='red'?'red':st(p.dp.end)==='amber'?'amber':'ok'}">通所介護計画書 ${wa(p.dp.end)}まで</span>`:'<span class="tag t-gray">通所介護計画書なし</span>';
    if(p.kp)plans+=`<span class="tag t-ok">個別機能訓練計画書 ${wa(p.kp.made)}作成</span>`;
  }
  // 最近の記録
  const ds=[...new Set(S.log.filter(r=>r.pid===p.n).map(r=>r.d).concat(Object.keys(S.day).filter(k=>k.endsWith('|'+p.n)).map(k=>k.split('|')[0])))].sort().reverse().slice(0,8);
  const hist=ds.map(d=>{const r=recs(p.n,d);const x=dayRec(p.n,d);const mo=x.mood?MOODS.find(m=>m[0]===x.mood):null;
    return `<div class="h"><span class="d">${md(d)}</span><span>${r.map(z=>exi(z.k).lb+(z.n?' '+z.n:'')).join('・')||'—'}${mo?'　'+mo[1]+mo[2]:''}${x.memo?'<br><span style="color:var(--sub)">'+esc(x.memo)+'</span>':''}</span></div>`}).join('');
  $('#sheet').innerHTML=`
  <div class="sh"><span class="nm">${esc(p.n)} 様</span><span class="tag t-gray">${esc(p.lv||'')}</span><button class="x" id="close">閉じる</button></div>
  <div class="plans">${plans}</div>
  ${p.warn&&p.warn.length?`<div class="warn"><b>⚠ 気をつけること</b><ul>${p.warn.map(w=>'<li>'+esc(w)+'</li>').join('')}</ul></div>`:''}
  ${p.goal?`<div class="box goal"><b>🎯 目標</b>　${esc(p.goal)}</div>`:''}
  ${!p.menu&&p.cat!=='shou'?`<div class="noplan">📄 ケアプランが届いていないため、基本メニューを表示しています。</div>`:''}
  <div class="sec" style="display:flex;align-items:center">${D===today()?'今日':md(D)}のメニュー <span style="font-weight:600;color:var(--sub);font-size:13px;margin-left:8px">押すと記録・もう一度押すと取り消し</span></div>
  <div class="mgrid">${mine.map(x=>mi(p,x)).join('')}${extraOn.map(k=>mi(p,{k})).join('')}</div>
  <button class="more" id="more">${showMore?'▲ メニュー集を閉じる':'＋ メニュー集からえらぶ（'+EXK.length+'種目）'}</button>
  ${showMore?`<div style="margin-top:6px">${lib}</div>`:''}
  <div class="sec">様子</div>
  <div class="moods">${MOODS.map(m=>`<button class="mood ${dr.mood===m[0]?'on':''}" data-m="${m[0]}"><span class="e">${m[1]}</span>${m[2]}</button>`).join('')}</div>
  <div class="sec">メモ</div>
  <textarea id="memo" placeholder="回数、痛みの有無、気づいたことなど">${esc(dr.memo||'')}</textarea>
  ${hist?`<div class="sec">最近の記録</div><div class="box hist">${hist}</div>`:''}
  <button class="more" id="pprint" style="margin-top:16px">🖨 この方のシートを印刷・PDFにする（${D.slice(5,7).replace(/^0/,'')}月分）</button>
  <button class="more" id="pdel" style="margin-top:10px;color:var(--red)">🗑 この方を一覧から消す（利用終了など）</button>`;
  $('#close').onclick=closeP;
  $('#more').onclick=()=>{showMore=!showMore;renderSheet()};
  $('#pprint').onclick=()=>printPS([p],D.slice(0,7));
  $('#pdel').onclick=()=>{if(!confirm(p.n+' さんを一覧から消しますか？\n（これまでの記録は残ります。設定からいつでも戻せます）'))return;S.gone=S.gone||[];if(!S.gone.includes(p.n))S.gone.push(p.n);save();applyGone();closeP();toast('🗑 '+p.n+' さんを一覧から消しました')};
  $('#sheet').querySelectorAll('.mi').forEach(b=>b.onclick=()=>toggle(p.n,b.dataset.k));
  $('#sheet').querySelectorAll('.mood').forEach(b=>b.onclick=()=>{const v=dayRec(p.n,D).mood===b.dataset.m?'':b.dataset.m;setDay(p.n,{mood:v});renderSheet()});
  const ta=$('#memo');let tm;ta.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{setDay(p.n,{memo:ta.value});},400)};ta.onblur=()=>{setDay(p.n,{memo:ta.value})};
}

// ---------- 印刷用シート ----------
function psHTML(p,ym){
  const mine=(p.menu&&p.menu.length?p.menu:DEFMENU);
  let yy=0,mm=0,nd=31;if(ym){[yy,mm]=ym.split('-').map(Number);nd=new Date(yy,mm,0).getDate()}
  const keys=mine.map(x=>x.k);
  if(ym)EXK.forEach(k=>{if(!keys.includes(k)&&S.log.some(r=>r.pid===p.n&&r.k===k&&r.d.startsWith(ym)))keys.push(k)});
  const box=(lb,made,end,extra)=>{if(!made&&!end)return `<div class="pb none">${lb}<b>なし</b></div>`;return `<div class="pb ${st(end)}">${lb}<b>${end?wa(end)+' まで':'期限不明'}</b>${made?'作成 '+wa(made):''}${end?'（'+left(end)+'）':''}${extra?'<br>'+extra:''}</div>`};
  let pl='';
  if(p.cat==='shou')pl='<div class="pb none" style="grid-column:1/-1">障がい福祉サービス利用</div>';
  else pl=box('ケアプラン',p.cp&&p.cp.made,cpEnd(p),p.cp&&p.cp.note?esc(p.cp.note):'')+box('通所介護計画書',p.dp&&p.dp.made,p.dp&&p.dp.end)+(p.kp?box('個別機能訓練計画書（3か月見直し）',p.kp.made,kpEnd(p)):'<div class="pb none">個別機能訓練計画書<b>なし</b></div>');
  let th='<tr><th class="l">'+(ym?mm+'月':'日付')+'</th>';for(let d=1;d<=nd;d++)th+=`<th>${d}</th>`;th+='</tr>';
  const row=(lb,f)=>{let h=`<tr><td class="l">${lb}</td>`;for(let d=1;d<=nd;d++){const ds=ym?ym+'-'+String(d).padStart(2,'0'):'';const v=ym?f(ds):'';h+=`<td class="${v&&v!==' '?'on':''}">${v||''}</td>`}return h+'</tr>'};
  let gr=keys.map(k=>row(exi(k).lb,ds=>isOn(p.n,ds,k)?'✓':'')).join('');
  gr+=row('様子',ds=>{const m=dayRec(p.n,ds).mood;return m?MOODS.find(x=>x[0]===m)[1]:''});
  const memos=ym?Object.keys(S.day).filter(k=>k.endsWith('|'+p.n)&&k.startsWith(ym)&&S.day[k].memo).sort().map(k=>`<tr><td style="width:60px">${md(k.split('|')[0])}</td><td>${esc(S.day[k].memo)}</td></tr>`).join(''):'';
  const blank=Array.from({length:Math.max(0,(mine.length>4?3:6)-(memos.match(/<tr>/g)||[]).length)},()=>'<tr><td style="width:60px"></td><td></td></tr>').join('');
  return `<div class="ps"><div class="hd"><h1>${esc(p.n)} 様<small>${esc(p.lv||'')}${p.trial?'・体験':''}</small></h1><div class="r">機能訓練シート　${ym?yy+'年'+mm+'月':'　　　年　　月'}<br>デイサービスシャイン</div></div>
  <div class="pl3">${pl}</div>
  ${p.warn&&p.warn.length?`<div class="wn"><b style="color:#c0412f">⚠ 気をつけること</b><ul>${p.warn.map(w=>'<li>'+esc(w)+'</li>').join('')}</ul></div>`:''}
  ${p.goal?`<div class="gl"><b style="color:#4f9a7c">🎯 目標</b>　${esc(p.goal)}</div>`:''}
  <div class="ttl">訓練メニュー${!p.menu&&p.cat!=='shou'?'（ケアプランが届いていないため基本メニュー）':''}</div>
  <table class="mn"><tr><th style="width:118px">種目</th><th style="width:44px">姿勢</th><th>やり方・注意</th><th style="width:96px">回数</th></tr>${mine.map(x=>{const e=exi(x.k);return `<tr><td><b>${e.ic} ${esc(e.lb)}</b></td><td>${esc(e.pos||'')}</td><td>${x.t?'<b>'+esc(x.t)+'</b><br>':''}${esc(e.how||'')}${e.ca?'<br><span style="color:#c0412f">⚠ '+esc(e.ca)+'</span>':''}</td><td>${esc(x.d||e.dose||'')}${x.m?'<br>'+x.m+'分':''}</td></tr>`}).join('')}</table>
  <div class="ttl" style="margin-top:8px">実施記録（実施した日に ✓）</div>
  <table class="gr">${th}${gr}</table>
  <div class="ttl" style="margin-top:8px">メモ</div>
  <table class="memo" style="width:100%">${memos}${blank}</table>
  <div class="ft"><span>様子：😊よい 🙂ふつう 😣痛み・疲れ 🙅見合わせ</span><span>出力 ${wa(today())}</span></div></div>`;
}
function printPS(list,ym){
  $('#pa').innerHTML=list.map(p=>psHTML(p,ym)).join('');
  document.body.classList.add('pp');
  const done=()=>{document.body.classList.remove('pp');$('#pa').innerHTML='';window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  setTimeout(()=>{window.print();setTimeout(done,1500)},80);
}
// ---------- 設定 ----------
function openSet(){
  cur=null;
  const ym=D.slice(0,7);
  $('#sheet').innerHTML=`<div class="sh"><span class="nm">⚙︎ 設定・記録</span><button class="x" id="close">閉じる</button></div>
  <div class="box set"><b>記録する人の名前（任意）</b><div class="hint" style="margin:2px 0 6px">この端末で記録した人として残ります</div><input class="tx" id="by" value="${esc(S.by)}" placeholder="例：看護 山田"></div>
  <div class="box set"><b>月の記録一覧</b><div class="rowb"><input type="month" class="tx" id="ym" value="${ym}" style="max-width:200px"><button class="btn pri" id="showM">表示</button><button class="btn noprint" id="prt">🖨 印刷</button><button class="btn noprint" id="csv">CSVで保存</button><button class="btn noprint" id="allps">👤 全員分のシートを印刷</button></div><div id="mtab"></div></div>
  ${(S.gone||[]).length?`<div class="box set noprint"><b>一覧から消した方</b><div class="hint" style="margin:2px 0 6px">まちがえて消したときは「戻す」を押してください</div>${S.gone.map(n=>`<div class="rowb" style="align-items:center"><span style="flex:1">${esc(n)}</span><button class="btn" data-back="${esc(n)}">戻す</button></div>`).join('')}</div>`:''}
  <div class="box set noprint"><b>バックアップ</b><div class="hint" style="margin:2px 0 6px">記録はこのiPadの中だけに保存されます。機種変更の前などに書き出してください。</div><div class="rowb"><button class="btn" id="exp">書き出す</button><label class="btn">読み込む<input type="file" id="imp" accept=".json,application/json" hidden></label></div></div>
  <div class="ver">版 ${BUILD}</div>`;
  $('#ov').classList.add('show');document.body.style.overflow='hidden';
  $('#close').onclick=closeP;
  $('#by').oninput=e=>{S.by=e.target.value;save()};
  $('#sheet').querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{S.gone=S.gone.filter(n=>n!==b.dataset.back);save();applyGone();toast('↩ '+b.dataset.back+' さんを戻しました');openSet()});
  const show=()=>{$('#mtab').innerHTML=monthTable($('#ym').value)};
  $('#showM').onclick=show;show();
  $('#allps').onclick=()=>printPS(PEOPLE,$('#ym').value);
  $('#prt').onclick=()=>{show();setTimeout(()=>window.print(),100)};
  $('#csv').onclick=()=>{const y=$('#ym').value;const rows=[['日付','利用者','メニュー','記録者','様子','メモ']];
    S.log.filter(r=>r.d.startsWith(y)).sort((a,b)=>a.d<b.d?-1:1).forEach(r=>{const x=dayRec(r.pid,r.d);const mo=x.mood?MOODS.find(m=>m[0]===x.mood)[2]:'';rows.push([r.d,r.pid,exi(r.k).cat+'：'+exi(r.k).lb+(r.n?'（'+r.n+'）':''),r.by||'',mo,x.memo||''])});
    dl('機能訓練_'+y+'.csv','﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')};
  $('#exp').onclick=()=>dl('機能訓練_バックアップ_'+today()+'.json',JSON.stringify(S),'application/json');
  $('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!j.log)throw 0;const seen=new Set(S.log.map(r=>r.pid+r.d+r.k));j.log.forEach(r=>{if(!seen.has(r.pid+r.d+r.k))S.log.push(r)});for(const k in j.day)if(!S.day[k])S.day[k]=j.day[k];if(j.gone){S.gone=[...new Set([...(S.gone||[]),...j.gone])];applyGone()}save();toast('読み込みました');renderMain()}catch(x){toast('⚠ 読み込めませんでした')}};rd.readAsText(f)};
}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function monthTable(y){
  if(!y)return'';const [yy,mm]=y.split('-').map(Number);const nd=new Date(yy,mm,0).getDate();
  const L=PEOPLE.filter(p=>S.log.some(r=>r.pid===p.n&&r.d.startsWith(y)));
  if(!L.length)return '<p class="hint" style="margin:10px 0">この月の記録はまだありません</p>';
  let h=`<div style="font-weight:800;margin:8px 0">${yy}年${mm}月 機能訓練 実施記録（デイサービスシャイン）</div><div class="mtwrap"><table class="mt"><tr><th>利用者</th>`;
  for(let d=1;d<=nd;d++)h+=`<th>${d}</th>`;h+='<th>計</th></tr>';
  L.forEach(p=>{let tot=0;h+=`<tr><td class="n">${esc(p.n)}</td>`;for(let d=1;d<=nd;d++){const ds=y+'-'+String(d).padStart(2,'0');const r=recs(p.n,ds);if(r.length)tot++;h+=`<td title="${r.map(z=>exi(z.k).lb).join('・')}">${r.map(z=>exi(z.k).ic).join('')}</td>`}h+=`<td><b>${tot}</b></td></tr>`});
  return h+'</table></div><div class="hint" style="margin-top:6px">'+MKEYS.map(k=>MENU[k].ic+MENU[k].lb).join('　')+'</div>';
}
// ---------- イベント ----------
$('#main').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b)return openP(b.dataset.p);const f=e.target.closest('[data-df]');if(f){dfilt=dfilt===f.dataset.df?'all':f.dataset.df;renderMain();}});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){filt=b.dataset.f;renderMain()}});
$('#q').addEventListener('input',renderMain);
$('#tabT').onclick=()=>{tab='t';renderMain();scrollTo(0,0)};
$('#tabD').onclick=()=>{tab='d';renderMain();scrollTo(0,0)};
$('#dPrev').onclick=()=>{const t=pd(D);t.setDate(t.getDate()-1);D=ymd(t);renderMain()};
$('#dNext').onclick=()=>{const t=pd(D);t.setDate(t.getDate()+1);if(ymd(t)<=today()){D=ymd(t);renderMain()}};
$('#gear').onclick=openSet;
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeP()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(D>today())D=today();renderMain();checkVer()}});
async function checkVer(){if(BUILD==='dev')return;try{const r=await fetch('version.txt?t='+Date.now(),{cache:'no-store'});const v=(await r.text()).trim();if(v&&v!==BUILD&&sessionStorage.getItem('rl')!==v){sessionStorage.setItem('rl',v);location.reload()}}catch(e){}}
// ---------- 暗号化データ ----------
async function unlock(k){
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(k),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(ENC_DATA.salt),iterations:ENC_DATA.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(ENC_DATA.iv)},key,b(ENC_DATA.ct))));
}
(async()=>{
  if(ENC_DATA){
    const m=location.hash.match(/^#k=([\w-]+)/);
    let k=m?m[1]:null;try{if(k)localStorage.setItem(KEY+'-k',k);else k=localStorage.getItem(KEY+'-k')}catch(e){}
    try{if(!k)throw 0;PEOPLE=await unlock(k);ALL=null}catch(e){
      $('header').style.display='none';
      $('#main').innerHTML='<div class="lock"><div style="font-size:40px">🔒</div><h3>このiPadはまだ準備ができていません</h3><p style="color:var(--sub)">相談員から「iPad設定用」のQRコードを読み取ってください。</p></div>';return}
  }
  applyGone();renderMain();checkVer();
})();
</script>
