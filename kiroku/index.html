<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f6">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="介護記録">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>介護記録（試作）</title>
<style>
:root{
  --bg:#eef2f6; --card:#ffffff; --ink:#28323c; --sub:#6f7c88; --line:#dbe3ea;
  --accent:#3b7fb0; --accent-bg:#e1eef8; --accent-ink:#ffffff;
  --red:#d55a4a; --red-bg:#fde7e3; --amber:#c98a1d; --amber-bg:#fcf0d6; --ok:#3f9a74; --ok-bg:#e0f2e9;
  --gray-bg:#eef1f4; --shadow:0 2px 12px rgba(30,55,80,.08); --r:16px;
  --c-vital:#d5694f; --c-meal:#d9962b; --c-water:#3b8fc4; --c-toilet:#8a6cc1; --c-bath:#2f9fa0; --c-nap:#6d7fb8; --c-train:#4f9a5c; --c-note:#7d8791; --c-pick:#b0607e; --c-med:#a8508f; --c-care:#5c86a8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1f25; --card:#242b33; --ink:#eaf0f5; --sub:#a0adb9; --line:#36404a;
    --accent:#5a9bd0; --accent-bg:#22384a; --red-bg:#4a2a25; --amber-bg:#4a3a1c; --ok-bg:#20402f; --gray-bg:#2c343d; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1f25; --card:#242b33; --ink:#eaf0f5; --sub:#a0adb9; --line:#36404a;
  --accent:#5a9bd0; --accent-bg:#22384a; --red-bg:#4a2a25; --amber-bg:#4a3a1c; --ok-bg:#20402f; --gray-bg:#2c343d; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:17px;line-height:1.5;padding-bottom:40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:10px 0 0;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .dot{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:16px}
.brand small{font-weight:600;font-size:12px;color:var(--amber);background:var(--amber-bg);padding:2px 8px;border-radius:999px}
.sp{flex:1}
.day{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.day button{border:0;background:transparent;width:38px;height:38px;border-radius:50%;font-size:18px}
.day button:active{background:var(--line)}
.day b{min-width:128px;text-align:center;font-size:16px;white-space:nowrap}
.day b.notToday{color:var(--amber)}
.pill{border:0;background:var(--card);height:46px;padding:0 16px;border-radius:999px;box-shadow:var(--shadow);font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.gear{border:0;background:var(--card);width:46px;height:46px;border-radius:50%;box-shadow:var(--shadow);font-size:19px}
nav.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav.tabs button{border:0;background:transparent;padding:10px 18px 12px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap;font-size:16px}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{padding-top:16px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.bar h2{margin:0;font-size:18px}
.bar .count{color:var(--sub);font-size:15px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--card);box-shadow:var(--shadow);min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--gray-bg);box-shadow:none}
.btn.danger{background:var(--red-bg);color:var(--red);box-shadow:none}
.btn:disabled{opacity:.4}
.note-banner{background:var(--amber-bg);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.note-banner b{color:var(--amber)}

/* user cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ucard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;border:2px solid transparent;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px}
.ucard:active{border-color:var(--accent)}
.ucard .nm{font-size:20px;font-weight:800;display:flex;align-items:baseline;gap:8px}
.ucard .nm small{font-size:13px;color:var(--sub);font-weight:600}
.ucard .alert{font-size:13px;color:var(--red);background:var(--red-bg);border-radius:8px;padding:2px 8px;align-self:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--gray-bg);color:var(--sub);white-space:nowrap}
.chip.done{color:#fff}
.chip.k-vital.done{background:var(--c-vital)} .chip.k-meal.done{background:var(--c-meal)} .chip.k-water.done{background:var(--c-water)}
.chip.k-toilet.done{background:var(--c-toilet)} .chip.k-bath.done{background:var(--c-bath)} .chip.k-note.done{background:var(--c-note)}
.chip.k-nap.done{background:var(--c-nap)} .chip.k-pick.done{background:var(--c-pick)} .chip.k-med.done{background:var(--c-med)} .chip.k-care.done{background:var(--c-care)} .chip.k-train.done{background:var(--c-train)}
.ucard .last{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{background:var(--card);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--sub)}

/* person view */
.person{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media (max-width:820px){.person{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.phead .back{border:0;background:var(--card);box-shadow:var(--shadow);height:46px;padding:0 16px;border-radius:999px;font-weight:700}
.phead h2{margin:0;font-size:24px}
.phead .lv{color:var(--sub);font-size:15px}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:820px){.kinds{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.kinds{grid-template-columns:repeat(2,1fr)}}
.kbtn{border:0;border-radius:14px;padding:14px 6px;min-height:84px;color:#fff;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.kbtn span{font-size:26px;line-height:1}
.kbtn small{font-weight:600;font-size:12px;opacity:.9}
.kbtn:active{filter:brightness(.92)}
.k-vital.kbtn{background:var(--c-vital)} .k-meal.kbtn{background:var(--c-meal)} .k-water.kbtn{background:var(--c-water)} .k-toilet.kbtn{background:var(--c-toilet)}
.k-bath.kbtn{background:var(--c-bath)} .k-nap.kbtn{background:var(--c-nap)} .k-train.kbtn{background:var(--c-train)} .k-note.kbtn{background:var(--c-note)} .k-pick.kbtn{background:var(--c-pick)} .k-med.kbtn{background:var(--c-med)} .k-care.kbtn{background:var(--c-care)}
.feebar{background:var(--amber-bg);border-radius:10px;padding:8px 12px;margin:-4px 0 12px;font-weight:700;font-size:15px}
.sumrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media (max-width:620px){.sumrow{grid-template-columns:repeat(2,1fr)}}
.sum{background:var(--gray-bg);border-radius:12px;padding:8px 10px}
.sum .l{font-size:12px;color:var(--sub)}
.sum .v{font-weight:800;font-size:17px}
.sum .v.bad{color:var(--red)}
.tl{width:100%;border-collapse:collapse}
.tl td,.tl th{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.tl th{font-size:13px;color:var(--sub);font-weight:600}
.tl tr.row{cursor:pointer}
.tl tr.row:active{background:var(--gray-bg)}
.tl .tm{width:64px;font-weight:700;font-variant-numeric:tabular-nums}
.tl .kd{width:96px}
.tl .by{width:90px;color:var(--sub);font-size:14px}
.tag{display:inline-block;color:#fff;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.tag.k-vital{background:var(--c-vital)} .tag.k-meal{background:var(--c-meal)} .tag.k-water{background:var(--c-water)} .tag.k-toilet{background:var(--c-toilet)}
.tag.k-bath{background:var(--c-bath)} .tag.k-nap{background:var(--c-nap)} .tag.k-train{background:var(--c-train)} .tag.k-note{background:var(--c-note)} .tag.k-pick{background:var(--c-pick)} .tag.k-med{background:var(--c-med)} .tag.k-care{background:var(--c-care)}
.bad{color:var(--red);font-weight:800}

/* bulk */
.seg{display:inline-flex;background:var(--card);border-radius:12px;padding:4px;box-shadow:var(--shadow);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:700;min-height:42px}
.seg button.on{background:var(--accent);color:#fff}
.btable{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.btable th,.btable td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.btable th{font-size:13px;color:var(--sub);background:var(--gray-bg);font-weight:600;white-space:nowrap}
.btable td.nm{font-weight:800;white-space:nowrap;font-size:17px}
.btable input.num{width:84px;height:46px;border:2px solid var(--line);border-radius:10px;text-align:center;font-size:18px;font-weight:700;background:var(--bg)}
.btable input.num:focus{outline:none;border-color:var(--accent)}
.btable input.num.bad{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.btable .saved{color:var(--ok);font-size:13px;font-weight:700;white-space:nowrap}
.minis{display:flex;gap:4px;flex-wrap:wrap}
.mini{border:2px solid var(--line);background:var(--bg);border-radius:10px;min-width:46px;height:44px;padding:0 8px;font-weight:700}
.mini.on{background:var(--accent);border-color:var(--accent);color:#fff}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.38);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet{border-radius:22px}}
.sheet h3{margin:0 0 4px;font-size:21px;display:flex;align-items:center;gap:10px}
.sheet .who{color:var(--sub);font-size:15px;margin-bottom:14px}
.field{margin:14px 0}
.field>label{display:block;font-size:14px;color:var(--sub);font-weight:700;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.optsep{flex-basis:100%;font-size:14px;font-weight:700;color:var(--sub);margin-top:8px}
.opt .yen{display:block;font-size:12px;font-weight:700;color:var(--amber);line-height:1.1}.opt.on .yen{color:inherit}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:12px;min-height:52px;min-width:64px;padding:0 14px;font-weight:700;font-size:17px}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.vgrid{grid-template-columns:repeat(4,1fr)}}
.vbox{background:var(--bg);border-radius:12px;padding:8px 10px;border:2px solid var(--line)}
.vbox.bad{border-color:var(--red);background:var(--red-bg)}
.vbox label{font-size:13px;color:var(--sub);font-weight:700}
.vbox input{width:100%;border:0;background:transparent;font-size:28px;font-weight:800;padding:0;outline:none}
.vbox .u{font-size:13px;color:var(--sub)}
.bp{display:flex;align-items:center;gap:4px}
.bp input{width:50%}
textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);font-size:17px;resize:vertical}
textarea:focus,.timein:focus{outline:none;border-color:var(--accent)}
.timein{height:50px;border:2px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);font-size:20px;font-weight:700}
.phr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.phr button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:15px}
.sheet .acts{display:flex;gap:10px;margin-top:18px;position:sticky;bottom:-18px;background:var(--card);padding:10px 0 4px}
.sheet .acts .btn{flex:1;min-height:56px;font-size:18px}
.sheet .acts .btn.danger{flex:0 0 auto}
.list-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:56vh;overflow:auto;padding:2px}
.list-pick .opt{width:100%;text-align:left}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#28323c;color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;z-index:80;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.hint{font-size:13px;color:var(--sub)}
.sec{margin:22px 0 8px;font-weight:800}
/* テンプレート */
.tplbtn{border:0;background:var(--accent-bg);color:var(--accent);font-weight:800;border-radius:999px;padding:7px 14px;font-size:15px;margin-top:8px}
#ov2{z-index:60}
.tsearch{width:100%;height:50px;border:2px solid var(--line);border-radius:12px;padding:0 14px;background:var(--bg);font-size:18px}
.tsearch:focus{outline:none;border-color:var(--accent)}
.tcats{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tcats button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.tcats button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tlist{display:grid;grid-template-columns:1fr;gap:6px;max-height:48vh;overflow:auto}
@media (min-width:700px){.tlist{grid-template-columns:1fr 1fr}}
.tlist button{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;text-align:left;font-size:16px;min-height:50px}
.tlist button.used{border-color:var(--ok);background:var(--ok-bg)}
.tlist .cat{display:block;font-size:11px;color:var(--sub)}
.tprev{background:var(--gray-bg);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--sub);margin-top:10px;max-height:80px;overflow:auto;white-space:pre-wrap}
/* 連絡帳 */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;border:2px solid transparent;text-align:left;display:flex;gap:10px;align-items:center;width:100%}
.rcard:active{border-color:var(--accent)}
.rcard .th{width:64px;height:64px;border-radius:12px;background:var(--gray-bg);flex:0 0 64px;display:grid;place-items:center;font-size:26px;overflow:hidden}
.rcard .th img{width:100%;height:100%;object-fit:cover}
.rcard .nm{font-weight:800;font-size:18px}
.st{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;display:inline-block}
.st.none{background:var(--gray-bg);color:var(--sub)} .st.draft{background:var(--amber-bg);color:var(--amber)} .st.done{background:var(--ok-bg);color:var(--ok)}
.redit{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:900px){.redit{grid-template-columns:1fr}}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--gray-bg);max-width:100%}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:16px}
.addph{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:12px;min-height:64px;font-weight:800;color:var(--accent);cursor:pointer;background:var(--bg)}
.addph input{display:none}
.field>label.addph{display:flex;font-size:17px;color:var(--accent);margin:0}
.book{background:#fffdf7;color:#3a3226;border-radius:18px;box-shadow:var(--shadow);padding:20px;border:1px solid #eadfca}
.book h4{margin:0;font-size:13px;color:#9a7b4f;letter-spacing:.08em}
.book .bt{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #eadfca;padding-bottom:8px;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.book .bt b{font-size:22px}
.book table{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:12px}
.book td{border:1px solid #eadfca;padding:6px 8px}
.book td:first-child{background:#f7efe0;width:84px;font-weight:700;white-space:nowrap}
.book .msg{white-space:pre-wrap;font-size:16px;line-height:1.8;background:#fff;border:1px solid #eadfca;border-radius:10px;padding:10px 12px;min-height:60px}
.book .bph{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.book .bph img{width:100%;border-radius:10px;display:block;max-width:100%}
.book .sub{font-size:13px;font-weight:800;color:#9a7b4f;margin:14px 0 4px}
.book .by{text-align:right;font-size:13px;color:#8a7a62;margin-top:10px}
.rbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* 印刷プレビュー */
#pv{position:fixed;inset:0;z-index:90;background:#8a949e;overflow:auto;display:none;-webkit-overflow-scrolling:touch}
#pv.show{display:block}
.pvbar{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--card);box-shadow:var(--shadow);flex-wrap:wrap}
.pvbar b{font-size:17px}
.pvbar .hint{flex:1;min-width:200px}
.pvpages{padding:20px 12px 60px;display:flex;flex-direction:column;align-items:center;gap:20px}
.pg{background:#fff;color:#222;width:210mm;max-width:100%;min-height:297mm;padding:14mm 13mm;box-shadow:0 4px 18px rgba(0,0,0,.25);font-size:13px;line-height:1.55;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg .ph1{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:10px;gap:10px}
.pg .ph1 h1{margin:0;font-size:20px;letter-spacing:.2em}
.pg .ph1 .fac{font-size:12px;text-align:right}
.pg .who2{display:flex;gap:18px;align-items:baseline;margin-bottom:10px;flex-wrap:wrap}
.pg .who2 b{font-size:18px}
.pg table.rt{width:100%;border-collapse:collapse}
.pg table.rt th,.pg table.rt td{border:1px solid #888;padding:5px 7px;text-align:left;vertical-align:top}
.pg table.rt th{background:#eef0f2;font-weight:700;font-size:12px}
.pg table.rt td.c{white-space:nowrap;width:1%}
.pg .bad{color:#c0392b}
.pg .stamp{display:flex;justify-content:flex-end;margin-top:14px}
.pg .stamp table{border-collapse:collapse}
.pg .stamp td{border:1px solid #888;width:64px;text-align:center;font-size:11px;padding:2px}
.pg .stamp tr:last-child td{height:52px}
.pg .book{box-shadow:none;border:1px solid #d8ccb4;border-radius:10px;font-size:15px}
.pg .book .bph{grid-template-columns:repeat(2,1fr)}

  });

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function attDefault(d,users){ // デモ用：日付ごとに15人くらい
  const r=mulberry(parseInt(d.replace(/-/g,''),10)); return users.filter(()=>r()<0.75).map(u=>u.id);
}

/* ===== 日付・ユーティリティ ===== */
function ymd(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function nowHM(){const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')}
let cur = new Date(); let tab='list'; let personId=null; let bulkKind='vital';
const W='日月火水木金土';
function dayStr(){return ymd(cur)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function userById(id){return S.users.find(u=>u.id===id)}
function todayIds(){const d=dayStr(); if(!S.att[d]){ S.att[d]= S.demo?attDefault(d,S.users):[]; save(); } return S.att[d].filter(id=>userById(id));}
function entriesOf(uid,d=dayStr()){return S.entries.filter(e=>e.d===d&&e.uid===uid).sort((a,b)=>a.time.localeCompare(b.time))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}

/* 異常値の目安（試作。施設長・看護師と要相談） */
const LIM={t:[35.5,37.5],sys:[90,160],dia:[0,100],p:[50,100],o:[93,101]};
function isBad(k,v){ if(v===''||v==null||isNaN(+v)) return false; const [lo,hi]=LIM[k]; return +v<lo||+v>=hi; }

function describe(e){
  const x=e.data||{};
  switch(e.kind){
    case 'vital':{
      const p=[];
      if(x.t) p.push(`体温 <span class="${isBad('t',x.t)?'bad':''}">${esc(x.t)}℃</span>`);
      if(x.sys||x.dia) p.push(`血圧 <span class="${isBad('sys',x.sys)||isBad('dia',x.dia)?'bad':''}">${esc(x.sys)}/${esc(x.dia)}</span>`);
      if(x.p) p.push(`脈拍 <span class="${isBad('p',x.p)?'bad':''}">${esc(x.p)}</span>`);
      if(x.o) p.push(`SpO2 <span class="${isBad('o',x.o)?'bad':''}">${esc(x.o)}%</span>`);
      return p.join('　')+(x.memo?'<br>'+esc(x.memo):'');
    }
    case 'meal': return `主食 ${esc(x.main||'-')}割　副食 ${esc(x.side||'-')}割`+(x.memo?'　'+esc(x.memo):'');
    case 'water': return `${esc(x.what||'水分')} ${esc(x.ml)}ml`+(+x.yen?`（諸費用 ${esc(x.yen)}円）`:'')+(x.memo?'　'+esc(x.memo):'');
    case 'toilet': return [x.type,x.where,x.amt&&('量 '+x.amt)].filter(Boolean).map(esc).join('・')+(x.fees&&x.fees.length?`（諸費用 ${[x.pad&&x.pad!=='なし'&&'パット'+x.pad,x.pants&&x.pants!=='なし'&&'リハパン'+x.pants,x.wash==='あり'&&'洗濯'].filter(Boolean).map(esc).join('・')} ${x.fees.reduce((a,f)=>a+ +f[1],0)}円）`:'')+(x.memo?'　'+esc(x.memo):'');
    case 'bath': return [x.how,x.how!=='中止'&&x.hair].filter(Boolean).map(esc).join('・')+(x.memo?'　'+esc(x.memo):'');
    case 'med': return esc(x.when||'')+(x.how?'・'+(/拒否|持参なし/.test(x.how)?`<span class="bad">${esc(x.how)}</span>`:esc(x.how)):'')+(x.memo?'　'+esc(x.memo):'');
    case 'care': return [x.what,x.part&&('部位：'+x.part)].filter(Boolean).map(esc).join('・')+(x.memo?'　'+esc(x.memo):'');
    case 'pick': return [x.dir,x.how,x.walk].filter(Boolean).map(esc).join('・')+(x.memo?'　'+esc(x.memo):'');
    case 'nap': return `${esc(x.from||'')}〜${esc(x.to||'')}`+(x.memo?'　'+esc(x.memo):'');
    case 'train': return [x.what].filter(Boolean).map(esc).join('')+(x.memo?'　'+esc(x.memo):'');
    case 'note': return esc(x.text||'').replace(/\n/g,'<br>');
  }
  return '';
}
function plain(e){const d=document.createElement('div');d.innerHTML=describe(e);return d.textContent}

function render(){
  const isToday = dayStr()===ymd(new Date());
  const lab=document.getElementById('dayLabel');
  lab.textContent=`${cur.getMonth()+1}月${cur.getDate()}日（${W[cur.getDay()]}）`+(isToday?'':' ');
  lab.className=isToday?'':'notToday';
  const sb=document.getElementById('staffBtn');
  sb.innerHTML = S.me?`👤 ${esc(S.me)}`:'👤 記録者を選ぶ'; sb.className='pill'+(S.me?'':' warn');
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const m=document.getElementById('main');
  if(tab==='renraku'&&!personId) lineImport(false);
  if(tab==='renraku'){ m.innerHTML= personId?viewRenrakuEdit(personId):viewRenrakuList(); bindMain(); if(personId) bindRenraku(personId); return; }
  if(tab==='list' && personId) m.innerHTML=viewPerson(personId);
  else if(tab==='list') m.innerHTML=viewList();
  else if(tab==='bulk') m.innerHTML=viewBulk();

}
function banner(){
  return `<div class="note-banner noprint">ℹ️ <div><b>試作版です。</b>記録はこのiPadの中だけに保存されます（他のiPadとは共有されません）。名前はサンプルです。</div></div>`;
}
function statusChips(uid){
  const es=entriesOf(uid); const has=k=>es.some(e=>e.kind===k);
  const ml=es.filter(e=>e.kind==='water').reduce((a,e)=>a+(+e.data.ml||0),0);
  const tc=es.filter(e=>e.kind==='toilet').length;
  const meal=es.find(e=>e.kind==='meal');
  const bath=es.find(e=>e.kind==='bath');
  const c=(k,label,on)=>`<span class="chip k-${k} ${on?'done':''}">${label}</span>`;
  const pk=es.filter(e=>e.kind==='pick'); const pin=pk.find(e=>e.data.dir==='お迎え'), pout=pk.find(e=>e.data.dir==='お送り');
  const fee=feesOf(uid).reduce((a,x)=>a+x.yen,0);
  return (fee?`<span class="chip k-water done" style="background:var(--amber)">諸費用 ${fee}円</span>`:'')+c('pick',pout?`送迎 ${pin?pin.time+'〜':''}${pout.time}`:pin?`お迎え ${pin.time}`:'送迎',pk.length>0)+c('vital','バイタル',has('vital'))+c('meal',meal?`食事 ${meal.data.main||'-'}/${meal.data.side||'-'}`:'食事',!!meal)+c('water',ml?`水分 ${ml}ml`:'水分',ml>0)+c('toilet',tc?`排泄 ${tc}回`:'排泄',tc>0)+c('bath',bath?`入浴 ${bath.data.how}`:'入浴',!!bath)+c('med','服薬',has('med'))+c('note','様子',has('note'));
}
function vitalAlert(uid){
  const v=entriesOf(uid).filter(e=>e.kind==='vital').pop(); if(!v) return '';
  const x=v.data; const bads=[];
  if(isBad('t',x.t)) bads.push('体温'); if(isBad('sys',x.sys)||isBad('dia',x.dia)) bads.push('血圧'); if(isBad('p',x.p)) bads.push('脈拍'); if(isBad('o',x.o)) bads.push('SpO2');
  return bads.length?`<span class="alert">⚠ ${bads.join('・')}が目安外</span>`:'';
}
function viewList(){
  const ids=todayIds();
  let h=banner()+`<div class="bar"><h2>本日の利用者</h2><span class="count">${ids.length}名</span><div class="sp"></div><button class="btn" data-act="pickAtt">＋ 利用者を選ぶ</button></div>`;
  if(!ids.length) return h+`<div class="empty">この日の利用者がいません。<br>右上の「＋ 利用者を選ぶ」から追加してください。</div>`;
  h+='<div class="grid">';
  ids.forEach(id=>{
    const u=userById(id); const es=entriesOf(id); const last=es[es.length-1];
    h+=`<button class="ucard" data-act="open" data-id="${id}">
      <div class="nm">${esc(u.n)}<small>${esc(u.lv||'')}</small></div>
      ${vitalAlert(id)}
      ${u.warn?`<div class="hint">⚠ ${esc(u.warn)}</div>`:''}
      <div class="chips">${statusChips(id)}</div>
      <div class="last">${last?`最終 ${last.time} ${KINDS[last.kind].n}：${esc(plain(last))}`:'まだ記録がありません'}</div>
    </button>`;
  });
  return h+'</div>';
}
function viewPerson(uid){
  const u=userById(uid); const es=entriesOf(uid);
  const ids=todayIds(); const ix=ids.indexOf(uid);
  const prevId=ix>0?ids[ix-1]:null, nextId=ix>=0&&ix<ids.length-1?ids[ix+1]:null;
  const v=es.filter(e=>e.kind==='vital').pop();
  const ml=es.filter(e=>e.kind==='water').reduce((a,e)=>a+(+e.data.ml||0),0);
  const meal=es.find(e=>e.kind==='meal');
  const tc=es.filter(e=>e.kind==='toilet').length;
  let h=`<div class="phead noprint"><button class="back" data-act="back">‹ 一覧へ</button>
    <h2>${esc(u.n)} 様</h2><span class="lv">${esc(u.lv||'')}</span><div class="sp" style="flex:1"></div>
    <button class="btn ghost" data-act="prRec" data-id="${uid}">🖨 印刷・PDF</button>
    <button class="btn ghost" data-act="open" data-id="${prevId||''}" ${prevId?'':'disabled'}>‹ 前の人</button>
    <button class="btn ghost" data-act="open" data-id="${nextId||''}" ${nextId?'':'disabled'}>次の人 ›</button></div>`;
  if(u.warn) h+=`<div class="note-banner" style="background:var(--red-bg)">⚠ <div><b style="color:var(--red)">注意事項：</b>${esc(u.warn)}</div></div>`;
  h+=`<div class="person"><div class="panel noprint"><div class="hint" style="margin-bottom:8px">記録する項目をタップ</div><div class="kinds">`+
    KORDER.map(k=>`<button class="kbtn k-${k}" data-act="new" data-kind="${k}"><span>${KINDS[k].i}</span>${KINDS[k].n}</button>`).join('')+
    `</div><button class="btn" style="width:100%;margin-top:10px;min-height:56px" data-act="toRenraku">📒 連絡帳を書く ${renrakuStatus(uid)}</button></div><div class="panel">
    <div class="sumrow">
      <div class="sum"><div class="l">バイタル（最新）</div><div class="v">${v?describeShortVital(v.data):'—'}</div></div>
      <div class="sum"><div class="l">食事 主食/副食</div><div class="v">${meal?`${meal.data.main||'-'} / ${meal.data.side||'-'} 割`:'—'}</div></div>
      <div class="sum"><div class="l">水分 合計</div><div class="v">${ml?ml+' ml':'—'}</div></div>
      <div class="sum"><div class="l">排泄</div><div class="v">${tc?tc+' 回':'—'}</div></div>
    </div>${feeText(uid)?`<div class="feebar">💴 諸費用：${esc(feeText(uid))}</div>`:''}
    <table class="tl"><thead><tr><th>時刻</th><th>項目</th><th>内容</th><th>記録者</th></tr></thead><tbody>`;
  if(!es.length) h+=`<tr><td colspan="4" class="hint" style="padding:30px;text-align:center">まだ記録がありません。左の項目ボタンから記録します。</td></tr>`;
  es.forEach(e=>{ h+=`<tr class="row" data-act="edit" data-eid="${e.id}"><td class="tm">${e.time}</td><td class="kd"><span class="tag k-${e.kind}">${KINDS[e.kind].short}</span></td><td>${describe(e)}</td><td class="by">${esc(e.by||'')}</td></tr>`; });
  h+=`</tbody></table><div class="hint" style="margin-top:8px">行をタップすると修正・削除できます。</div></div></div>`;
  return h;
}
function describeShortVital(x){
  const s=(k,v,u='')=>v?`<span class="${isBad(k,v)?'bad':''}">${esc(v)}${u}</span>`:'-';
  return `${s('t',x.t,'℃')} ${x.sys?`<span class="${isBad('sys',x.sys)||isBad('dia',x.dia)?'bad':''}">${esc(x.sys)}/${esc(x.dia)}</span>`:''}`;
}

    }
    if(bulkKind==='pick'){
      const pc=dir=>{const e=es.find(e=>e.kind==='pick'&&e.data.dir===dir); return `<td>${e?`<span class="saved" style="font-size:18px">✓ ${e.time}</span> <button class="mini" data-act="bp" data-v="${dir}" data-undo="1">取消</button>`:`<button class="mini" data-act="bp" data-v="${dir}">${dir==='お迎え'?'🚐 着いた':'🚐 出発'}</button>`}</td>`};
      h+=pc('お迎え')+pc('お送り');
    }
    if(bulkKind==='bath'){
      h+=`<td><div class="minis">${['一般浴','機械浴','シャワー浴','清拭','中止','なし'].map(v=>`<button class="mini ${(first?x.how:'')===v?'on':''}" data-act="bb" data-v="${v}">${v}</button>`).join('')}</div></td><td class="saved">${first?'✓ '+first.time:''}</td>`;
    }
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  if(bulkKind==='vital') h+=`<div class="hint" style="margin-top:8px">入力すると自動で保存されます。赤枠は目安外（体温37.5以上、血圧上160以上／90未満、脈拍100以上／50未満、SpO2 93未満）。目安は試作用の仮の値です。</div>`;
  if(bulkKind==='pick') h+=`<div class="hint" style="margin-top:8px">押した時刻で送迎の記録が入ります（送迎車）。ご家族送迎や乗降の様子は、利用者の画面の「送迎」から直せます。</div>`;
  if(bulkKind==='water') h+=`<div class="hint" style="margin-top:8px">ボタンを押すたびに、その時刻で水分の記録が1件追加されます。間違えたら利用者の画面から削除できます。</div>`;
  return h;
}

/* ===== 操作 ===== */
function bindMain(){
  document.querySelectorAll('#main [data-act]').forEach(el=>{
    const a=el.dataset.act;
    if(el.tagName==='INPUT') return;
    el.onclick=()=>{
      if(a==='open'){ if(!el.dataset.id) return; personId=el.dataset.id; render(); scrollTo(0,0); }
      else if(a==='back'){ personId=null; render(); }
      else if(a==='new'){ openSheet(personId,el.dataset.kind,null); }
      else if(a==='edit'){ const e=S.entries.find(x=>x.id===el.dataset.eid); if(e) openSheet(e.uid,e.kind,e); }
      else if(a==='pickAtt'){ openAttPicker(); }
      else if(a==='bk'){ bulkKind=el.dataset.kind; render(); }
      else if(a==='print'){ window.print(); }
      else if(a==='lineImport'){ lineImport(true); }
      else if(a==='prRecAll'){ printRecords(todayIds()); }
      else if(a==='prRec'){ printRecords([el.dataset.id]); }
      else if(a==='prBookAll'){ printBooks(todayIds().filter(id=>{const r=getR(id);return r&&r.done})); }
      else if(a==='prBook'){ printBooks([el.dataset.id]); }
      else if(a==='toRenraku'){ tab='renraku'; render(); scrollTo(0,0); }
      else if(a==='ropen'){ personId=el.dataset.id; render(); scrollTo(0,0); }
      else if(a==='rback'){ personId=null; render(); }
      else if(a==='bm'||a==='bb'||a==='bw'||a==='bp'){ bulkTap(el,a); }
    };
  });
  document.querySelectorAll('#main input[data-bv]').forEach(inp=>{
    inp.onchange=()=>bulkVital(inp);
    inp.oninput=()=>inp.classList.toggle('bad',isBad(inp.dataset.bv,inp.value));
  });
}
function needStaff(cb){ if(S.me) return cb(); openStaffPicker(cb); }
function upsertFirst(uid,kind,patch){
  const d=dayStr(); let e=S.entries.find(x=>x.d===d&&x.uid===uid&&x.kind===kind);
  if(!e){ e={id:uid+kind+Date.now().toString(36)+Math.random().toString(36).slice(2,5),d,uid,time:nowHM(),kind,data:{},by:S.me,ts:Date.now()}; S.entries.push(e); }
  Object.assign(e.data,patch); e.by=S.me; e.ts=Date.now(); save(); return e;
}
function bulkVital(inp){
  needStaff(()=>{
    const uid=inp.closest('tr').dataset.uid;
    const e=upsertFirst(uid,'vital',{[inp.dataset.bv]:inp.value.trim()});
    inp.closest('tr').querySelector('.saved').textContent='✓ '+e.time;
  });
}
function bulkTap(el,a){
  needStaff(()=>{
    const uid=el.closest('tr').dataset.uid;
    if(a==='bm'){ upsertFirst(uid,'meal',{[el.dataset.f]:el.dataset.v}); }
    if(a==='bb'){
      const d=dayStr();
      if(el.dataset.v==='なし'){ S.entries=S.entries.filter(x=>!(x.d===d&&x.uid===uid&&x.kind==='bath')); save(); }
      else upsertFirst(uid,'bath',{how:el.dataset.v,hair:'洗髪あり'});
    }
    if(a==='bp'){
      const d=dayStr(), dir=el.dataset.v;
      if(el.dataset.undo){ S.entries=S.entries.filter(x=>!(x.d===d&&x.uid===uid&&x.kind==='pick'&&x.data.dir===dir)); save(); }
      else { S.entries.push({id:uid+'p'+Date.now().toString(36),d,uid,time:nowHM(),kind:'pick',data:{dir,how:'送迎車'},by:S.me,ts:Date.now()}); save(); toast(`${userById(uid).n} 様 ${dir} ${nowHM()}`); }
    }
    if(a==='bw'){ S.entries.push({id:uid+'w'+Date.now().toString(36),d:dayStr(),uid,time:nowHM(),kind:'water',data:{ml:el.dataset.v,what:'お茶'},by:S.me,ts:Date.now()}); save(); toast(`${userById(uid).n} 様 水分 ${el.dataset.v}ml`); }
    render();
  });
}

    if(!S.staff.includes(S.me)) S.me='';

function daySummary(uid){
  const es=entriesOf(uid); const v=es.filter(e=>e.kind==='vital').pop(); const meal=es.find(e=>e.kind==='meal'); const bath=es.find(e=>e.kind==='bath');
  const ml=es.filter(e=>e.kind==='water').reduce((a,e)=>a+(+e.data.ml||0),0); const tc=es.filter(e=>e.kind==='toilet').length;
  return {v:v&&v.data, meal:meal&&meal.data, bath:bath&&bath.data, ml, tc, train:es.some(e=>e.kind==='train'), notes:es.filter(e=>e.kind==='note').map(e=>e.data.text)};
}
function draftFor(uid){
  const x=daySummary(uid); const p=[];
  if(x.v){ const vs=[]; if(x.v.t) vs.push(`体温は${x.v.t}℃`); if(x.v.sys) vs.push(`血圧は${x.v.sys}/${x.v.dia}`); if(vs.length) p.push(`本日の${vs.join('、')}でした。`); }

  if(x.meal){ const m=+x.meal.main, s=+x.meal.side; p.push(m>=8&&s>=8?'昼食はほぼ全部召し上がりました。':`昼食は主食${x.meal.main||'-'}割、おかず${x.meal.side||'-'}割召し上がりました。`); }

function shrink(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const img=new Image();
  img.onload=()=>{ const m=900, sc=Math.min(1,m/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.72)); };
  img.onerror=()=>{URL.revokeObjectURL(url);
    if(!window.createImageBitmap) return rej();
    createImageBitmap(file).then(bm=>{ const m=900, sc=Math.min(1,m/Math.max(bm.width,bm.height)); const c=document.createElement('canvas'); c.width=Math.round(bm.width*sc); c.height=Math.round(bm.height*sc); c.getContext('2d').drawImage(bm,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.72)); }).catch(rej); };
  img.src=url; }); }

/* ===== LINE・Googleドライブ連携 ===== */
function synced(){ return !!(S.sync&&S.sync.url&&S.sync.key); }
async function api(method,params){
  const u=S.sync.url;
  if(method==='GET'){ const q=new URLSearchParams({...params,key:S.sync.key}); const r=await fetch(u+(u.includes('?')?'&':'?')+q); return r.json(); }
  const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...params,key:S.sync.key})}); return r.json();
}
function syncInfo(what){
  sh.innerHTML=`<h3>${what==='line'?'📥 LINEの写真を連絡帳に':'☁ PDFをGoogleドライブに'}</h3>
  <div class="who">この機能は、LINE・Googleドライブとの連携を設定すると使えます（試作では未設定です）。</div>
  ${what==='line'?`<div class="field"><label>使い方（設定後）</label><div style="line-height:2">① いつものグループLINEに、利用者さんの名前だけを送る（例：上田キヨ）<br>② 続けて写真を送る（何枚でも。10分以内）<br>③ LINEに「上田キヨ 様の連絡帳に写真を入れました」と返事が来る<br>④ このアプリの連絡帳を開くと、写真が自動で入っています</div></div>`
  :`<div class="field"><label>使い方（設定後）</label><div style="line-height:2">① 印刷プレビューで「☁ ドライブに保存」を押す<br>② Googleドライブの「デイサービスシャイン_介護記録」フォルダに、月ごとに分けてPDFが保存されます<br>　連絡帳：今の連絡帳フォルダ／20261128／連絡帳20261128_上田キヨ様.pdf（シャイン管理アプリの同期・ご家族へのLINE通知にそのまま乗ります）<br>　経過記録：経過記録PDF／2026-11／経過記録_2026-11-28_全員.pdf</div></div>`}
  <div class="acts"><button class="btn primary" id="cancel">閉じる</button></div>`;
  ov.classList.add('show'); document.getElementById('cancel').onclick=closeSheet;
}
function shrinkSrc(src){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const m=900, sc=Math.min(1,m/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.72)); }; img.onerror=rej; img.src=src; }); }
let lineBusy=false, lineLast=0;
async function lineImport(manual){
  if(!synced()){ if(manual) syncInfo('line'); return; }
  if(lineBusy) return; if(!manual && Date.now()-lineLast<60000) return;
  lineBusy=true; lineLast=Date.now(); if(manual) toast('LINEの写真を確認しています…');
  try{
    const r=await api('GET',{action:'photos',date:dayStr()}); if(!r.ok) throw new Error(r.error);
    S.lineDone=S.lineDone||{}; S.renraku=S.renraku||{};
    const nm=x=>String(x||'').replace(/[\s　]/g,'').replace(/髙/g,'高').replace(/^（障）/,'');
    let n=0, miss=0;
    for(const p of r.photos){
      if(S.lineDone[p.id]) continue;
      const u=S.users.find(u=>nm(u.n)===nm(p.name)); if(!u){miss++;continue;}
      const ph=await api('GET',{action:'photo',id:p.id}); if(!ph.ok) continue;
      const src=await shrinkSrc(`data:${ph.type};base64,${ph.data}`);
      const k=rkey(u.id); const rr=S.renraku[k]||(S.renraku[k]={msg:'',photos:[],family:'',done:false});
      rr.photos.push(src); S.lineDone[p.id]=1; n++;
      if(todayIds().indexOf(u.id)<0){ S.att[dayStr()].push(u.id); }
    }
    save(); if(n||manual) toast(n?`LINEから写真${n}枚を取り込みました`:'新しい写真はありません'); if(n) render();
    if(miss&&manual) toast(`名簿にない名前の写真が${miss}枚ありました`);
  }catch(e){ if(manual) toast('⚠ LINEの写真を取り込めませんでした'); }
  lineBusy=false;
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function pdfLibs(){
  if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
}
async function pagesToPdf(els){
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  for(let i=0;i<els.length;i++){
    const c=await window.html2canvas(els[i],{scale:2,backgroundColor:'#ffffff',useCORS:true});
    let w=210, h=w*c.height/c.width; if(h>297){ h=297; w=h*c.width/c.height; }
    if(i) pdf.addPage(); pdf.addImage(c.toDataURL('image/jpeg',0.85),'JPEG',(210-w)/2,0,w,h);
  }
  return pdf.output('datauristring').split(',')[1];
}
document.getElementById('pvDrive').onclick=async()=>{
  if(!synced()){ syncInfo('drive'); return; }
  const b=document.getElementById('pvDrive'); if(b.disabled) return; b.disabled=true; const t0=b.textContent; b.textContent='作成中…';
  try{
    await pdfLibs(); const els=[...document.querySelectorAll('#pvPages .pg')]; const d=dayStr(); let n=0;
    if(PV.kind==='連絡帳'){
      for(let i=0;i<els.length;i++){ const u=userById(PV.ids[i]); b.textContent=`保存中 ${i+1}/${els.length}`;
        const r=await api('POST',{action:'uploadPdf',kind:'連絡帳',date:d,name:u.n,filename:`連絡帳${d.replace(/-/g,'')}_${u.n.replace(/[\s　]/g,'')}様.pdf`,data:await pagesToPdf([els[i]])}); if(r.ok) n++; }
    }else{
      const name=PV.ids.length===1?userById(PV.ids[0]).n.replace(/[\s　]/g,''):'全員';
      b.textContent='保存中…';
      const r=await api('POST',{action:'uploadPdf',kind:'経過記録',date:d,filename:`経過記録_${d}_${name}.pdf`,data:await pagesToPdf(els)}); if(r.ok) n++;
    }
    toast(n?`Googleドライブに保存しました（${n}件）`:'⚠ 保存できませんでした');
  }catch(e){ toast('⚠ 保存できませんでした。通信を確認してください'); }
  b.disabled=false; b.textContent=t0;
};
// 設定用リンク（#sync=URL|合言葉）で一度だけ設定
(function(){ const h=decodeURIComponent(location.hash||''); if(h.startsWith('#sync=')){ const [url,key]=h.slice(6).split('|'); S.sync={url,key}; save(); history.replaceState(null,'',location.pathname); setTimeout(()=>toast('連携の設定をしました'),300); } })();
